<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIFT</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AIFT">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="aift_logo/aift_logo.png">
  <link rel="icon" type="image/png" href="aift_logo/aift_logo.png">
  <script>
    // ตั้งธีมก่อนแอปโหลด เพื่อไม่ให้จอวาบ (อ่านค่าที่ผู้ใช้เคยเลือกไว้)
    (function () {
      var t = localStorage.getItem('aift-theme');
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
