<div class="inputs-grid">
  <!-- Mobile Tab Switcher (ซ่อนบน Desktop แสดงเฉพาะ Mobile <= 768px) -->
  <div class="mobile-tab-switcher">
    <sic-button
      type="button"
      [variant]="activeTab === 'expense' ? 'solid' : 'ghost'"
      color="primary"
      size="sm"
      (click)="setTab('expense')"
    >
      💸 รายจ่าย (AI)
    </sic-button>
    <sic-button
      type="button"
      [variant]="activeTab === 'income' ? 'solid' : 'ghost'"
      color="success"
      size="sm"
      (click)="setTab('income')"
    >
      💰 รายรับ
    </sic-button>
  </div>

  <!-- ส่วนรายจ่าย (AI) -->
  <div class="input-card expense-section" [class.mobile-hidden]="activeTab !== 'expense'">
    <div class="card-header">
      <span class="icon">💸</span> รายจ่าย (AI)
    </div>
    <div class="chat-input-container">
      <input
        type="file"
        #receiptInput
        accept="image/*"
        hidden
        (change)="onReceiptSelected($event)"
      />
      <sic-button
        variant="outline"
        color="primary"
        size="md"
        (click)="receiptInput.click()"
        [disabled]="isLoading || isScanning"
        [loading]="isScanning"
        title="สแกนใบเสร็จด้วยรูปถ่าย"
      >
        🧾
      </sic-button>
      <input
        type="text"
        [(ngModel)]="text"
        (keyup.enter)="onSubmit()"
        placeholder="พิมพ์รายจ่ายของคุณ (เช่น ข้าวผัด 50)"
        [disabled]="isLoading || isScanning"
        class="chat-input"
      />
      <sic-button
        variant="solid"
        color="primary"
        size="md"
        (click)="onSubmit()"
        [disabled]="isLoading || isScanning || !text.trim()"
        [loading]="isLoading"
      >
        บันทึก
      </sic-button>
    </div>
  </div>

  <!-- ส่วนรายรับ -->
  <div class="input-card income-section" [class.mobile-hidden]="activeTab !== 'income'">
    <div class="card-header">
      <span class="icon">💰</span> รายรับ
    </div>
    <div class="income-input-container">
      <input
        type="text"
        [(ngModel)]="incomeText"
        (keyup.enter)="onAddIncome()"
        placeholder="พิมพ์รายรับของคุณ (เช่น ขายของ 500)"
        [disabled]="isIncomeLoading"
        class="chat-input"
      />
      <sic-button
        variant="solid"
        color="success"
        size="md"
        (click)="onAddIncome()"
        [disabled]="isIncomeLoading || !incomeText.trim()"
        [loading]="isIncomeLoading"
      >
        บันทึก
      </sic-button>
    </div>
  </div>
</div>

<!-- SicDialog สำหรับแจ้งสถานะ AI / Error -->
<sic-dialog
  [open]="showStatusModal()"
  (closed)="showStatusModal.set(false)"
  [title]="statusData.title"
  width="400px"
>
  <div style="padding: 1rem 0; text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 8px;">{{ statusData.icon }}</div>
    <p style="font-size: 1rem; color: var(--sic-color-text); line-height: 1.5;">{{ statusData.message }}</p>
  </div>
  <div sicDialogFooter style="display: flex; justify-content: flex-end;">
    <sic-button variant="solid" color="primary" size="sm" (click)="showStatusModal.set(false)">ตกลง</sic-button>
  </div>
</sic-dialog>
