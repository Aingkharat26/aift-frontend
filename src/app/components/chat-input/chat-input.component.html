<div class="inputs-grid">
  <!-- ส่วนรายจ่าย (AI) -->
  <div class="input-card expense-section">
    <div class="card-header">
      <span class="icon">💸</span> รายจ่าย (AI)
    </div>
    <div class="chat-input-container">
      <input
        type="file"
        #receiptInput
        accept="image/*"
        hidden
        (change)="onReceiptSelected($event)"
      />
      <button
        class="scan-btn"
        (click)="receiptInput.click()"
        [disabled]="isLoading || isScanning"
        title="สแกนใบเสร็จด้วยรูปถ่าย"
      >
        <span *ngIf="!isScanning" class="scan-icon">🧾</span>
        <span *ngIf="isScanning" class="scan-loading">
          <span class="scan-spinner"></span>
        </span>
      </button>
      <input
        type="text"
        [(ngModel)]="text"
        (keyup.enter)="onSubmit()"
        placeholder="พิมพ์รายจ่ายของคุณ (เช่น ข้าวผัด 50)"
        [disabled]="isLoading || isScanning"
        class="chat-input"
      />
      <button (click)="onSubmit()" [disabled]="isLoading || isScanning || !text.trim()" class="send-btn">
        {{ isLoading ? '...' : 'บันทึก' }}
      </button>
    </div>
  </div>

  <!-- ส่วนรายรับ -->
  <div class="input-card income-section">
    <div class="card-header">
      <span class="icon">💰</span> รายรับ
    </div>
    <div class="income-input-container">
      <input
        type="text"
        [(ngModel)]="incomeText"
        (keyup.enter)="onAddIncome()"
        placeholder="พิมพ์รายรับของคุณ (เช่น ขายของ 500)"
        [disabled]="isIncomeLoading"
        class="chat-input"
      />
      <button (click)="onAddIncome()" [disabled]="isIncomeLoading || !incomeText.trim()" class="send-btn income-btn">
        {{ isIncomeLoading ? '...' : 'บันทึก' }}
      </button>
    </div>
  </div>
</div>

<!-- Dialog สำหรับแจ้งสถานะ AI / Error -->
<dialog #statusDialog class="modal-dialog">
  <div class="dialog-content">
    <div class="status-icon">{{ statusData.icon }}</div>
    <h3>{{ statusData.title }}</h3>
    <p>{{ statusData.message }}</p>

    <div class="dialog-actions">
      <button class="btn-confirm" (click)="statusDialog.close()">ตกลง</button>
    </div>
  </div>
</dialog>
