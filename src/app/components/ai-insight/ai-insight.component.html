<div
  class="ai-insight"
  *ngIf="aiLoading || aiSummary || aiFailed"
>
  <div class="ai-loading" *ngIf="aiLoading">
    <div class="spinner ai-spinner"></div>
    <span>AI กำลังวิเคราะห์การใช้จ่าย...</span>
  </div>

  <sic-button
    *ngIf="!aiLoading && aiSummary"
    variant="outline"
    color="primary"
    size="sm"
    (click)="showModal.set(true)"
  >
    สรุปวิเคราะห์จาก AI ({{ getMonthLabel() }}) ▸
  </sic-button>

  <p class="ai-error" *ngIf="!aiLoading && aiFailed && !aiSummary">
    AI ไม่ว่างในตอนนี้ ลองใหม่อีกครั้งภายหลังครับ
  </p>
</div>

<!-- SicDialog: ข้อความเต็มของสรุป AI -->
<sic-dialog
  [open]="showModal()"
  (closed)="showModal.set(false)"
  title="บทวิเคราะห์การเงินจาก AI"
  width="520px"
>
  <div class="dialog-body" style="padding: 1rem 0;">
    <div style="margin-bottom: 8px;">
      <sic-badge color="primary" size="sm">ประจำเดือน {{ getMonthLabel() }}</sic-badge>
    </div>
    <p class="full-text" style="line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap;">{{ aiSummary }}</p>
  </div>
  <div sicDialogFooter style="display: flex; justify-content: flex-end; gap: 8px;">
    <sic-button variant="solid" color="primary" size="sm" (click)="showModal.set(false)">ปิด</sic-button>
  </div>
</sic-dialog>
