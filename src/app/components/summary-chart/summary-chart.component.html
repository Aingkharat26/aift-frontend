<div class="chart-container">
  <h2 class="title">สรุปรายจ่ายเดือน {{ getMonthLabel() }}</h2>
  <div class="stats-grid" *ngIf="!loading">
    <div class="stat-card income">
      <span class="label">รายรับ</span>
      <span class="value">฿{{ incomeTotal | number:'1.0-0' }}</span>
    </div>
    <div class="stat-card expense">
      <span class="label">รายจ่าย</span>
      <span class="value">฿{{ getTotalSpent() | number:'1.0-0' }}</span>
    </div>
    <div class="stat-card balance" [class.negative]="getBalance() < 0" [class.positive]="getBalance() > 0">
      <span class="label">คงเหลือ</span>
      <span class="value">{{ getBalance() > 0 ? '+' : '' }}฿{{ getBalance() | number:'1.0-0' }}</span>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <span>กำลังโหลดข้อมูล...</span>
  </div>

  <div class="chart-wrapper" *ngIf="!loading && hasData()">
    <canvas baseChart #chart="base-chart"
      [data]="pieChartData"
      [options]="pieChartOptions"
      [type]="pieChartType">
    </canvas>
  </div>

  <app-ai-insight class="chart-insight"></app-ai-insight>
</div>
